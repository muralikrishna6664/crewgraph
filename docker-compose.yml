services:
  falkordb:
    image: falkordb/falkordb
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/data
    environment:
      FALKORDB_DATA_PATH: /data
      REDIS_ARGS: >-
        --appendonly yes
        --save 3600 1
        --save 300 100
        --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - workspace_data:/app/workspace
    environment:
      FALKORDB_HOST: falkordb
      LLM_PROVIDER: mock
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      SECRET_KEY: "${SECRET_KEY:-crewgraph-demo-only-change-this-secret}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  falkordb_data:
    name: crewgraph_falkordb_data
  workspace_data:
    name: crewgraph_workspace_data
