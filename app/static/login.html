<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · CrewGraph</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-layout">
    <form id="login-form" class="login-card">
      <span class="login-kicker">AGENT MEMORY / COORDINATION</span>
      <h1>CrewGraph</h1>
      <p>Sign in to your isolated demo workspace.</p>
      <label for="username">Tenant</label>
      <select id="username" name="username" required>
        <option value="acme">Acme</option>
        <option value="globex">Globex</option>
      </select>
      <label for="password">Demo password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Sign in</button>
      <div id="login-message" role="status"></div>
    </form>
  </main>
</body>
</html>
