<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrewGraph Dashboard</title>
  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>CrewGraph</h1>
    <label for="project-picker">Project</label>
    <select id="project-picker" aria-label="Project"></select>
    <button id="approve" class="primary">Approve</button>
    <button id="run-demo">Run demo</button>
    <button id="run-flaw">Run demo with flaw</button>
  </header>
  <div id="release-banner">Select a project to view release status.</div>
  <div id="legend" aria-label="Graph legend">
    <span class="legend-item"><i class="legend-swatch done"></i>Task done</span>
    <span class="legend-item"><i class="legend-swatch ready"></i>Task ready</span>
    <span class="legend-item"><i class="legend-swatch working"></i>Task claimed / Agent</span>
    <span class="legend-item"><i class="legend-swatch open-bug"></i>Open bug</span>
    <span class="legend-item"><i class="legend-swatch fixed-bug"></i>Fixed bug</span>
    <span class="legend-item"><i class="legend-swatch artifact"></i>Artifact</span>
    <span class="legend-item"><i class="legend-swatch other"></i>Project / approval</span>
  </div>
  <main>
    <section aria-label="Project graph">
      <div id="graph"></div>
      <div id="graph-caption">
        <span id="latest-event">Waiting for project events.</span>
        <span id="progress-track" role="progressbar" aria-label="Completed tasks">
          <span id="progress-fill"></span>
        </span>
        <span id="progress-label">0 / 0 done</span>
      </div>
    </section>
    <aside>
      <div class="panel">
        <h2>Selected node</h2>
        <dl id="details"><dt>Node</dt><dd>Click a graph node to inspect it.</dd></dl>
      </div>
      <div class="panel">
        <h2>Recent events</h2>
        <ol id="events"></ol>
      </div>
    </aside>
  </main>
  <div id="message" role="status"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
